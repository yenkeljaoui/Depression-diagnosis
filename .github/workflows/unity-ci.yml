# ✅ Workflow name (appears in the GitHub Actions UI)
name: Unity CI - Tests Only

# ✅ Trigger the workflow on push or pull request to the 'dev' branch
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  tests:  # ✅ Name of the job
    runs-on: ubuntu-latest  # ✅ GitHub will use the latest Ubuntu machine to run this job

    steps:
      # ✅ Step 1: Checkout the repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Step 2: Cache Unity packages to speed up the workflow
      - name: Cache Unity packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/unity  # ✅ Path to cache Unity downloads and dependencies
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}
          # ✅ Key ensures the cache updates if the manifest.json changes

      # ✅ Step 3: Run Editmode tests (tests that run inside the Unity editor)
      - name: Run Editmode Tests
        uses: game-ci/unity-test-runner@v2
        with:
          unityVersion: '2023.2.0f1'  # ✅ Unity version to use for testing
          testMode: editmode  # ✅ Specify Editmode tests

      # ✅ Step 4: Run Playmode tests (tests that run in play mode)
      - name: Run Playmode Tests
        uses: game-ci/unity-test-runner@v2
        with:
          unityVersion: '2023.2.0f1'  # ✅ Unity version to use for testing
          testMode: playmode  # ✅ Specify Playmode tests
