name: Unity CI - Tests Only 🎯

on:
  push:
    branches:
      - '**'


permissions:
  contents: read
  checks: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  playModeTests:
    name: Run PlayMode Tests 🕹️
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        id: playmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2023.2.0f1
          testMode: playmode
          projectPath: .
          customParameters: -disable-rendering -logFile /dev/stdout
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PlayMode Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlayModeTestResults
          path: ${{ steps.playmode.outputs.artifactsPath }}

  editModeTests:
    name: Run EditMode Tests 🧪
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2023.2.0f1
          testMode: editmode
          projectPath: .
          customParameters: -logFile /dev/stdout
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EditMode Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditModeTestResults
          path: ${{ steps.editmode.outputs.artifactsPath }}


