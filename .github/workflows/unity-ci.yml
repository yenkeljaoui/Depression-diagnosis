name: Unity CI - Tests Only

# Trigger the workflow on push or pull request events to the 'dev' branch
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  tests:
    # Specify the environment to run the job using a Unity editor Docker image
    runs-on: unityci/editor:ubuntu-2023.2.3f1-android-3

    steps:
   
      # Step 1: Checkout the repository code
      - name: Checkout
        uses: actions/checkout@v3

      # Step 2: Cache Unity packages to speed up the build process
      - name: Cache Unity packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/unity
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}

      # Step 3: Activate Unity license using credentials stored in GitHub Secrets
      - name: Activate Unity
        uses: game-ci/unity-activate@main
        with:
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unityVersion: '2023.2.0f1'  

      # Step 4: Run Editmode tests (tests that run without entering Play mode)
      - name: Run Editmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: editmode

      # Step 5: Run Playmode tests (tests that run while the game is playing)
      - name: Run Playmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: playmode
