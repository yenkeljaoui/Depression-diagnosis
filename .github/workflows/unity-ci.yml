name: Unity CI - Tests Only

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Unity packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/unity
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}

      - name: Activate Unity
        uses: game-ci/unity-activate@v4.1.0
        with:
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unityVersion: '2023.2.0f1'

      - name: Run Editmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: editmode

      - name: Run Playmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: playmode
