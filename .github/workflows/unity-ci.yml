name: Unity CI - Tests Only

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  tests:
    runs-on: unityci/editor:ubuntu-2023.2.3f1-android-3

    steps:
      # שלב 1: משיכת הקוד
      - name: Checkout
        uses: actions/checkout@v3

      # שלב 2 (אופציונלי): Cache Unity packages
      - name: Cache Unity packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/unity
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}

      # שלב 3: הפעלת רישיון Unity (Personal) בעזרת אימייל וסיסמה
      # כאן אנו משתמשים ב-main במקום v4.x
      - name: Activate Unity
        uses: game-ci/unity-activate@main
        with:
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
          unityVersion: '2023.2.0f1'  # שנה/התאם לפי גרסת Unity הרצויה

      # שלב 4: הרצת בדיקות Editmode
      - name: Run Editmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: editmode

      # שלב 5: הרצת בדיקות Playmode
      - name: Run Playmode Tests
        uses: game-ci/unity-test-runner@v4.3.1
        with:
          unityVersion: '2023.2.0f1'
          testMode: playmode
