name: Unity CI - Tests Only  # Name of the workflow (you'll see this in GitHub Actions)

on:
  push:
    branches: [dev]  # Run this workflow on pushes to the 'dev' branch
  pull_request:
    branches: [dev]  # Run this workflow on pull requests targeting the 'dev' branch

jobs:
  tests:  # Name of the job
    runs-on: ubuntu-latest  # The virtual machine that will run the job (Linux)

    steps:
      - name: Checkout repository  # Step 1: Get your code from GitHub
        uses: actions/checkout@v3

      - name: Cache Unity packages  # Step 2: Cache Unity dependencies to speed up builds
        uses: actions/cache@v3
        with:
          path: ~/.cache/unity
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}

      - name: Install Unity  # Step 3: Install Unity with your specific version
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: '2023.2.0f1'  # Your exact Unity version

      - name: Run Editmode Tests  # Step 4: Run Unity Editmode tests (for editor-level code)
        uses: game-ci/unity-test-runner@v2
        with:
          unityVersion: '2023.2.0f1'
          testMode: editmode  # Run editmode tests

      - name: Run Playmode Tests  # Step 5: Run Unity Playmode tests (for in-game testing)
        uses: game-ci/unity-test-runner@v2
        with:
          unityVersion: '2023.2.0f1'
          testMode: playmode  # Run playmode tests
